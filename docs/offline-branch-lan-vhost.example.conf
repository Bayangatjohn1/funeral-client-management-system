# EXAMPLE ONLY. Do not enable before replacing paths/hostname/certificates and reviewing host firewall.
# Trust the local CA certificate on both staff computers. Keep Apache/MariaDB on a private LAN.
<VirtualHost *:443>
    ServerName branch-a.example.internal
    DocumentRoot "C:/xampp/htdocs/funeral-system/public"
    SSLEngine on
    SSLCertificateFile "C:/secure-certificates/branch-a.crt"
    SSLCertificateKeyFile "C:/secure-certificates/branch-a.key"
    <Directory "C:/xampp/htdocs/funeral-system/public">
        AllowOverride All
        Options -Indexes
        Require ip 192.168.10.0/24
    </Directory>
</VirtualHost>
# Bind MariaDB to loopback, not the LAN address. Allow only HTTPS from the actual branch subnet.
# APP_URL must match ServerName with https://. Configure local DNS and reserved server IP.
# Set SESSION_SECURE_COOKIE=true after trusted TLS is working; keep APP_DEBUG=false.
# Only public/ is served. Never expose .env, storage/app/private, backups, vendor, or the project root.
